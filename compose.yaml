services:
  app:
    build:
      context: .
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /tmp
      # Your git identity, set by scripts/_lib.sh from the host's git config (unset: not passed).
      GIT_AUTHOR_NAME:
      GIT_AUTHOR_EMAIL:
      GIT_COMMITTER_NAME:
      GIT_COMMITTER_EMAIL:
      # Lets the gh CLI in the image talk to GitHub. Passed through from your shell when set;
      # an env_file (.env) can supply it too.
      GH_TOKEN:
      # Your host's ssh agent, shared through the socket mounted below.
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
      # Tells ./dev.sh it is already inside the app container: run commands directly.
      IN_APP_CONTAINER: "1"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-DEBUG}
      APP_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      # The frontend dev server (npm run dev) is allowed to call the API.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS-http://localhost:5173}
    volumes:
      - .:/app
      # The host's ssh agent socket (never your keys), set by scripts/_lib.sh
      # as SSH_AGENT_SOCKET. Without it (plain compose, a VS Code dev container,
      # no agent, DEV_SSH_AGENT=0) an empty placeholder is mounted: VS Code
      # forwards your agent itself, and nothing here can fail the start.
      # Long syntax: a colon in the path is harmless, and a stale path is an
      # error, not a root-owned directory created on your machine.
      - type: bind
        source: ${SSH_AGENT_SOCKET:-/dev/null}
        target: /tmp/ssh-agent.sock
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:

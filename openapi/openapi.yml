openapi: "3.0.3"
info:
  title: Tax Service
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: local
paths:
  /status/livez:
    get:
      tags: [Status]
      summary: Check liveness of application.
      operationId: getLivez
      responses:
        "200":
          description: App is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutput"
  /status/readyz:
    get:
      tags: [Status]
      summary: Check readiness of application.
      operationId: getReadyz
      responses:
        "200":
          description: App is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOutput"
components:
  schemas:
    StatusOutput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

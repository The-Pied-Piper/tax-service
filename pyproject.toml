# Tool configuration only. Dependencies live in requirements*.in (compiled to pinned requirements*.txt) and are pip-installed in Docker.

[tool.ruff]
line-length = 100
target-version = "py312"
# app/generated is the generator's output; ./dev.sh check fails if it differs from a fresh sync.
extend-exclude = ["migrations/versions", "tools/service_gen/templates", "app/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Stable import ordering whether or not app/ exists yet (it is created by init).
known-first-party = ["app", "tools"]

[tool.ruff.lint.per-file-ignores]
"app/generated/models.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations/versions", "tools/service_gen/templates"]

[[tool.mypy.overrides]]
module = ["connexion.*", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tax-engine does not ship a py.typed marker yet.
module = ["tax_engine.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["datamodel_code_generator.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

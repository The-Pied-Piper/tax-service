# Tool configuration only. Dependencies live in requirements*.in (compiled to pinned requirements*.txt) and are pip-installed in Docker.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions", "tools/service_gen/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Stable import ordering whether or not app/ exists yet (it is created by init).
known-first-party = ["app", "tools"]

[tool.ruff.lint.per-file-ignores]
"app/generated/models.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["migrations/versions", "tools/service_gen/templates"]

[[tool.mypy.overrides]]
module = ["connexion.*", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["datamodel_code_generator.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Layer rules, checked by `lint-imports` (part of ./dev.sh lint, once app/ exists).
# Services own these: add contracts as the service grows.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers point inward"
type = "layers"
containers = ["app"]
layers = [
    "main",
    "adapters",
    "application",
    "domain",
]
# Every other module under app must be named here or placed in a layer above, so a new
# module cannot slip in unchecked: generated is the wire code, settings the configuration.
exhaustive = true
exhaustive_ignores = ["generated", "settings"]

[[tool.importlinter.contracts]]
id = "core-framework-free"
name = "Domain and application know no framework, wire model or settings"
type = "forbidden"
source_modules = ["app.domain", "app.application"]
forbidden_modules = [
    "connexion",
    "pydantic",
    "pydantic_core",
    "pydantic_settings",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "httpx",
    "fastapi",
    "jsonschema",
    "starlette",
    "app.generated",
    "app.settings",
]

[[tool.importlinter.contracts]]
id = "outbound-wire-free"
name = "Outbound adapters import no web framework or wire model directly"
type = "forbidden"
source_modules = ["app.adapters.outbound"]
forbidden_modules = ["connexion", "fastapi", "httpx", "jsonschema", "pydantic", "starlette", "app.generated"]
# Direct imports only: an outbound adapter may import app.settings, which uses pydantic_settings.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "adapters-sides"
name = "Every adapter is inbound or outbound, and the two sides never import each other"
type = "layers"
containers = ["app.adapters"]
layers = ["inbound | outbound"]
exhaustive = true

[[tool.importlinter.contracts]]
id = "adapters-depend-on-ports-only"
name = "Adapters import ports, never services (only the composition root knows services)"
type = "forbidden"
source_modules = ["app.adapters", "app.generated"]
forbidden_modules = ["app.application.services"]

[[tool.importlinter.contracts]]
id = "application-sublayers"
name = "Inside the application, services depend on ports, never the reverse"
type = "layers"
containers = ["app.application"]
layers = ["services", "ports"]
exhaustive = true

[[tool.importlinter.contracts]]
id = "generated-is-wire-only"
name = "Generated code does not reach the application, domain, outbound adapters, settings or main"
type = "forbidden"
source_modules = ["app.generated"]
forbidden_modules = ["app.application", "app.domain", "app.adapters.outbound", "app.settings", "app.main"]
# Direct only: handlers reach the application through the inbound adapter they call.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "settings-is-a-leaf"
name = "Settings import nothing from the app"
type = "forbidden"
source_modules = ["app.settings"]
forbidden_modules = ["app.domain", "app.application", "app.adapters", "app.generated", "app.main"]

[[tool.importlinter.contracts]]
id = "inbound-no-persistence"
name = "Inbound adapters never touch the database stack or settings"
type = "forbidden"
source_modules = ["app.adapters.inbound"]
forbidden_modules = ["sqlalchemy", "asyncpg", "alembic", "app.settings"]

[[tool.importlinter.contracts]]
id = "main-wires-concretes-only"
name = "Composition root imports concretes only: no port, domain module, DTO or validation library"
type = "forbidden"
source_modules = ["app.main"]
forbidden_modules = ["pydantic", "pydantic_core", "app.domain", "app.application.ports", "app.generated.models"]
# Direct imports only: main reaches these through the adapters and services it wires.
allow_indirect_imports = true

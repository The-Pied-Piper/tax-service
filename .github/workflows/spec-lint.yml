name: Spec lint

on:
  push:
    branches: [main, dev]
    paths:
      - openapi/**
      - service_scripts/lint-api.sh
      - service_scripts/spec-lint/**
      - .github/workflows/spec-lint.yml
  pull_request:
    paths:
      - openapi/**
      - service_scripts/lint-api.sh
      - service_scripts/spec-lint/**
      - .github/workflows/spec-lint.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service_scripts/spec-lint/package-lock.json

      # The same command as local development.
      - name: Lint the API spec
        run: ./dev.sh lint-api

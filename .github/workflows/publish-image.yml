name: Publish image

# Builds the production image and pushes it to the dev ECR repository on every
# merge to main, using a short-lived OIDC role (no stored keys). It does nothing
# until the repository variables AWS_ACCOUNT_ID_DEV and AWS_ECR_PUSH_ROLE_ARN_DEV
# are set, which happens once tax-infra has created the ECR repository and the role.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    # Variables, not secrets: account ids and role ARNs are not secret.
    if: ${{ vars.AWS_ACCOUNT_ID_DEV != '' && vars.AWS_ECR_PUSH_ROLE_ARN_DEV != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN_DEV }}
          aws-region: ca-central-1

      - uses: docker/setup-buildx-action@v3

      # The same command as pushing by hand.
      - name: Push the image
        env:
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID_DEV }}
        run: ./dev.sh push-image dev "$ACCOUNT_ID"

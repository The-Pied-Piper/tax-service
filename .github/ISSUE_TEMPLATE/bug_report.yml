name: Bug report
description: Something in the API or this repository does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here: please report those privately, see [SECURITY.md](https://github.com/The-Pied-Piper/tax-service/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The request you sent (or the commands you ran) and the response you got.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: the release (v1, v2, ...) or the commit hash

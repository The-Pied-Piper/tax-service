# Lint rules for openapi/openapi.yml. Run with ./dev.sh lint-api (CI runs the same command).
# Base rules: Spectral's OpenAPI set plus the AEP set (AEP follows Google's API
# improvement proposals). Every change below carries a one-line reason.
extends:
  - spectral:oas
  - "@aep_dev/aep-openapi-linter"

overrides:
  # Status probes return one object, not a list, so the paging rules do not apply to them.
  - files:
      - "../../openapi/openapi.yml#/paths/~1status~1livez"
      - "../../openapi/openapi.yml#/paths/~1status~1readyz"
      - "../../openapi/openapi.yml#/components/schemas/StatusOutput"
    rules:
      aep-158-max-page-size-parameter: "off"
      aep-158-page-token-parameter: "off"
      aep-158-response-array-property: "off"
      aep-158-response-next-page-token-property: "off"

rules:
  # The generator turns operationId into a Python function name, so the AEP form is unusable.
  aep-132-operation-id: "off"
